# Keep the historical package identity: Electron userData remains
# %APPDATA%/gd-pe-teacher-assistant. No previous installer/appId was configured.
appId: com.electron.gd-pe-teacher-assistant
productName: gd-pe-teacher-assistant
artifactName: gd-pe-teacher-assistant-${version}-Windows-${arch}-setup.${ext}
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
extraResources: []
win:
  target:
    - target: nsis
      arch: [x64]
  executableName: gd-pe-teacher-assistant
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: false
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  deleteAppDataOnUninstall: false
  runAfterFinish: false
