# Keep the historical package identity: Electron userData remains
# %APPDATA%/gd-pe-teacher-assistant. No previous installer/appId was configured.
appId: com.electron.gd-pe-teacher-assistant
productName: gd-pe-teacher-assistant
artifactName: gd-pe-teacher-assistant-${version}-Windows-${arch}-setup.${ext}
directories:
  output: release
files:
  - out/**/*
  - package.json
  # pdfjs-dist is only used in the main process to extract text from reference PDFs.
  - "!node_modules/pdfjs-dist/{build,web,types,image_decoders}/**"
  - "!node_modules/pdfjs-dist/**/*.map"
  - "!node_modules/@napi-rs/**"
asar: true
npmRebuild: false
extraResources: []
win:
  target:
    - target: nsis
      arch: [x64]
  executableName: gd-pe-teacher-assistant
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: false
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  deleteAppDataOnUninstall: false
  runAfterFinish: false
# Baked into resources/app-update.yml. Local dist:win still passes publish: never.
# A GitHub Release must include the setup exe, .exe.blockmap, and latest.yml.
publish:
  provider: github
  owner: globalhunter0
  repo: gd-pe-teacher-assistant
  releaseType: release
